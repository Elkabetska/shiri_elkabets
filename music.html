<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מוזיקה | שירי אלקבץ</title>
    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    
    <header>
        <div class="profile-image-container">
            <img src="images/profile.jpg" alt="תמונת פרופיל של שירי אלקבץ" class="profile-image">
        </div>
        <h1>שירי אלקבץ</h1> 
    </header>

    <!-- אזור הלשוניות מתמלא אוטומטית דרך nav.js -->
    <div class="tabs-container">
        <div class="tabs-image-bar"></div>
    </div>
    
    <div class="tab-content-page">
        
        <div class="back-button-container" style="margin-bottom: 20px;">
            <!-- יתמלא אוטומטית דרך nav.js -->
        </div>
        
        <div class="content-box">
            <h2>המוזיקה שלי</h2>
            
            <!-- תמונה ראשית -->
            <div style="margin: 20px auto; max-width: 600px;">
                <img src="images/mymusic.jpg" alt="המוזיקה של שירי אלקבץ" style="width: 100%; height: auto; border-radius: 8px;">
            </div>

            <p style="margin-bottom: 30px;">האזינו למוזיקה שלי:</p>

            <!-- 3 תמונות נוספות אחת ליד השנייה בגודל זהה ללא חיתוך -->
            <div style="display: flex; gap: 15px; justify-content: center; align-items: stretch; flex-wrap: wrap; width: 100%; margin-top: 20px;">
                
                <div style="flex: 1; min-width: 220px; max-width: 300px; display: flex; flex-direction: column;">
                    <img src="images/elkaband.jpeg" alt="אלקה בנד" style="width: 100%; height: 250px; object-fit: contain; border-radius: 8px; border: 2px solid var(--color-accent-soft); background-color: var(--color-secondary-bg);">
                </div>

                <div style="flex: 1; min-width: 220px; max-width: 300px; display: flex; flex-direction: column;">
                    <img src="images/womenOfWords.jpg" alt="נשים של מילים" style="width: 100%; height: 250px; object-fit: contain; border-radius: 8px; border: 2px solid var(--color-accent-soft); background-color: var(--color-secondary-bg);">
                </div>

                <div style="flex: 1; min-width: 220px; max-width: 300px; display: flex; flex-direction: column;">
                    <img src="images/wooma.jpg" alt="ומה" style="width: 100%; height: 250px; object-fit: contain; border-radius: 8px; border: 2px solid var(--color-accent-soft); background-color: var(--color-secondary-bg);">
                </div>

            </div>

        </div>
    </div>
    
    <footer>
        <p>&copy; 2025 שירי אלקבץ | כל הזכויות שמורות.</p>
    </footer>

    <script src="nav.js"></script>
</body>
</html>
