<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קבוצות | שירי אלקבץ</title>
    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* התאמות נקודתיות עבור גודל הכרטיסים והתמונה החתוכה */
        .groups-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .group-card {
            max-width: 260px;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
        }
        .group-card .group-image {
            width: 100%;
            height: 160px;
            object-fit: contain; /* מונע חיתוך של התמונה ומציג אותה במלואה */
            background-color: #f9f9f9; /* רקע עדין למקרה שהפרופורציות שונות */
            border-radius: 6px;
        }
    </style>
</head>

<body>
    
    <header>
        <div class="profile-image-container">
            <img src="images/profile.jpg" alt="תמונת פרופיל של שירי אלקבץ" class="profile-image">
        </div>
        <h1>שירי אלקבץ</h1> 
    </header>

    <!-- אזור הלשוניות מתמלא כעת אוטומטית דרך nav.js -->
    <div class="tabs-container">
        <div class="tabs-image-bar"></div>
    </div>
    
    <div class="tab-content-page">
        
        <div class="back-button-container" style="margin-bottom: 20px;">
            <!-- יתמלא אוטומטית דרך nav.js -->
        </div>
        
        <div class="content-box">
            <h2>קבוצות וסדנאות קבועות</h2>
            
            <!-- תמונת ההנחיה manha.jpg מוקטנת ב-30% נוספים -->
            <div style="margin: 20px auto; max-width: 210px;">
                <img src="images/manha.jpg" alt="הנחיית קבוצות" class="full-tab-design" style="width: 100%; height: auto; border-radius: 8px;">
            </div>

            <p style="margin-bottom: 30px;">לחצו על הקבוצה לקבלת פלייר ופרטים מלאים.</p>

            <div class="groups-grid">
                
                <a href="group-guitar.html" class="group-card">
                    <img src="images/guitarchildren.jpeg" alt="קבוצת ליווי בגיטרה" class="group-image">
                    <h3>ליווי בגיטרה</h3>
                    <p>קבוצת מתחילים ומתקדמים</p>
                </a>

                <a href="group-kids.html" class="group-card">
                    <img src="images/socialability.jpg" alt="מיומנויות חברתיות לילדים" class="group-image">
                    <h3>מיומנויות חברתיות לילדים</h3>
                    <p>דרך מוזיקה וצליל</p>
                </a>
                
            </div>
            
            <p style="margin-top: 30px; border-top: 1px solid var(--color-accent-soft); padding-top: 20px;">
                לבירורים כלליים על הקבוצות:
            </p>
            
            <div class="contact-buttons-with-logos">
                
                <a href="https://wa.me/972542479477?text=הי.+ברצוני+לקבל+פרטים+לגבי+קבוצה+שאת+מנחה" 
                   target="_blank" 
                   class="cta-button" 
                   style="background-color: #25D366;">
                    <img src="images/whatsapplogo.png" alt="לוגו וואטסאפ">
                    יצירת קשר בווצאפ
                </a>
                
                <a href="mailto:elkabetska@gmail.com?subject=בירור לגבי הצטרפות לקבוצות" 
                   class="cta-button" 
                   style="background-color: var(--color-accent-deep);">
                    <img src="images/maillogo.png" alt="לוגו מייל">
                    יצירת קשר למייל
                </a>
            </div>
            
        </div>
    </div>
    
    <footer>
        <p>&copy; 2025 שירי אלקבץ | כל הזכויות שמורות.</p>
    </footer>

    <script src="nav.js"></script>
</body>
</html>
