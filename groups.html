<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קבוצות | שירי אלקבץ</title>
    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    
    <header>
        <div class="profile-image-container">
            <img src="images/profile.jpg" alt="תמונת פרופיל של שירי אלקבץ" class="profile-image">
        </div>
        <h1>שירי אלקבץ</h1> 
    </header>

    <!-- אזור הלשוניות מתמלא אוטומטית דרך nav.js -->
    <div class="tabs-container">
        <div class="tabs-image-bar"></div>
    </div>
    
    <div class="tab-content-page">
        
        <div class="back-button-container" style="margin-bottom: 20px;">
            <!-- יתמלא אוטומטית דרך nav.js -->
        </div>
        
        <div class="content-box">
            
            <h2>הקבוצות שלי</h2>
            
            <div style="text-align: right; margin: 20px 0; line-height: 1.6;">
                <p style="margin-bottom: 15px; font-size: 1.1rem;">
                    כאן תוכלו למצוא את מגוון הקבוצות והסדנאות שאני מציעה ומעבירה.
                </p>
            </div>

            <!-- רשת הקבוצות (ללא אנסמבל מענה קולי שהועבר לעמוד עצמאי) -->
            <div class="groups-grid">
                <!-- כאן יופיעו שאר הקבוצות שלך, אם קיימות -->
            </div>
            
        </div>
    </div>
    
    <footer>
        <p>&copy; 2025 שירי אלקבץ | כל הזכויות שמורות.</p>
    </footer>

    <script src="nav.js"></script>
</body>
</html>
